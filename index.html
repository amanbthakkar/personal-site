<!DOCTYPE html>
<html itemscope="" itemtype="http://schema.org/WebPage" lang="en">
<head>
    <meta http-equiv="content-type" content="text/html;charset=utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta id="viewport" name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="apple-touch-icon" href="/images/favicon/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="192x192" href="/images/favicon/android-chrome-192x192.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/images/favicon/favicon-16x16.png">
    <link rel="manifest" href="/images/favicon/site.webmanifest">
    <meta name="theme-color" content="#ffffff">
    <link rel="canonical" href="https://amanthakkar.com/">
    <link href="https://fonts.googleapis.com/css?family=Source+Sans+Pro:400,700|Raleway:400,800,900" rel="stylesheet" async>
    <!-- Security Headers -->
    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    <meta http-equiv="X-Frame-Options" content="DENY">
    <meta http-equiv="X-XSS-Protection" content="1; mode=block">
    <meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin">
</head>
<body>
    <div id="root"></div>
    <!-- Fast redirect for shortened URLs - runs BEFORE React loads -->
    <script>
    (function() {
      var path = window.location.pathname.replace(/^\/+/, '').split('/')[0];
      // Skip known routes and empty paths
      var knownRoutes = ['', 'resume', 'projects', 'blogs', 'contact', 'url-shortener', 'power-law-oscillator-indicator', 'static', 'images', 'data'];
      if (knownRoutes.indexOf(path) !== -1) return;
      // Looks like a shortened URL - check API immediately
      fetch('https://cloud.amanthakkar.com/shorten/?shortened=' + path)
        .then(function(r) { return r.ok ? r.json() : Promise.reject(); })
        .then(function(data) {
          if (data && data.originalURL) {
            var url = data.originalURL;
            if (!/^https?:\/\//i.test(url)) url = 'https://' + url;
            window.location.href = url;
          }
        })
        .catch(function() { /* Let React handle invalid URLs */ });
    })();
    </script>
    <script type="module" src="/src/index.jsx"></script>
</body>
</html>
